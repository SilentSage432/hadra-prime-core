apiVersion: apps/v1
kind: Deployment
metadata:
  name: adrae
  namespace: adrae
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adrae
  template:
    metadata:
      labels:
        app: adrae
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      initContainers:
        - name: init-adrae-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Preparing ADRAE data directories..."
              mkdir -p /data/logs
              mkdir -p /data/memory
              mkdir -p /data/continuity
              mkdir -p /data/stability
              mkdir -p /data/substrate
              chown -R 1000:1000 /data
              chmod -R 755 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: adrae-data
              mountPath: /data

      containers:
        - name: adrae
          image: ghcr.io/silentsage432/adrae:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: adrae-data
              mountPath: /data

      volumes:
        - name: adrae-data
          hostPath:
            path: /var/mnt/adrae
            type: Directory
